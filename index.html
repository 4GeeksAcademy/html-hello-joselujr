<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario HTML 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="container my-5">

        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Payment for example</h4>
            </div>

            <div class="alert alert-danger my-3 mx-3" role="alert">
                Some fields are missing
            </div>

            <div class="container mt-2">

                <form class="row g-3 needs-validation" novalidate>

                    <div class="col-5">
                        <label for="validationCustom01" class="form-label"> <b>Card #</b></label>
                        <input type="number" class="form-control" id="validationCustom01" placeholder="XXXXXXXXXXXXXXXX"
                            required>
                    </div>

                    <div class="col-3">
                        <label for="validationCustom02" class="form-label"><b>CVC #</b></label>
                        <input type="number" class="form-control" id="validationCustom02" placeholder="0000" required>
                    </div>

                    <div class="col-4">
                        <label for="validationCustomUsername" class="form-label"><b>Amount</b></label>
                        <div class="input-group">
                            <span class="input-group-text" id="basic-addon3"><b>$</b></span>
                            <input type="number" class="form-control" id="validationCustomUsername"
                                aria-describedby="inputGroupPrepend" required>
                        </div>
                    </div>

                    <div class="col-6">
                        <label for="validationCustom01" class="form-label"><b>First name</b></label>
                        <input type="text" class="form-control" id="validationCustom01" required>
                    </div>

                    <div class="col-6 mb-">
                        <label for="validationCustom01" class="form-label"><b>Last Name</b></label>
                        <input type="text" class="form-control" id="validationCustom01" required>
                    </div>

                    <div class="col-6 mb-2">
                        <label for="validationCustom03" class="form-label"><b>City</b></label>
                        <input type="text" class="form-control" id="validationCustom03" required>
                        <div class="invalid-feedback">
                            Please provide a valid city.
                        </div>
                    </div>

                    <div class="col-3">
                        <label for="validationDefault04" class="form-label"><b>State</b></label>
                        <input type="text" class="form-control" id="validationDefault04" placeholder="Pick a state"
                            required>
                    </div>

                    <div class="col-3">
                        <label for="validationDefault05" class="form-label"><b>Postal Code</b></label>
                        <input type="number" class="form-control" id="validationDefault05" required>
                    </div>

                    <div class="col-6">
                        <label for="validationCustom01" class="form-label"><b>We Accept:</b></label>
                        <div class=" col-5 rounded bg-secondary d-flex justify-content-center">

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                                    value="option1">
                                <label class="form-check-label" for="inlineRadio1"><i class="fa-brands fa-cc-mastercard"
                                        style="color: rgb(245, 245, 245);"></i></label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                                    value="option2">
                                <label class="form-check-label" for="inlineRadio2"><i class="fa-brands fa-cc-visa"
                                        style="color: rgb(245, 245, 245);"></i></label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3"
                                    value="option3">
                                <label class="form-check-label" for="inlineRadio3"><i
                                        class="fa-brands fa-cc-diners-club"
                                        style="color: rgb(245, 245, 245);"></i></label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio4"
                                    value="option3">
                                <label class="form-check-label" for="inlineRadio4"><i class="fa-brands fa-cc-amex"
                                        style="color: rgb(245, 245, 245);"></i></label>
                            </div>

                        </div>

                    </div>

                    <div class="col-6">
                        <label for="exampleFormControlTextarea1" class="form-label"><b>Message</b></label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                        <div id="emailHelp" class="form-text">Add any notes here</div>
                    </div>

                </form>

            </div>

            <div class="card-footer d-flex justify-content-end">
                <button class="btn btn-secondary mx-1" type="button">Cancel</button>
                <button class="btn btn-primary mx-1" type="button">Send</button>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
